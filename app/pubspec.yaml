name: spraylog
description: Voice-first pesticide application recordkeeping.
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.0
  flutter: ^3.29.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  go_router: ^14.8.1
  supabase_flutter: ^2.9.0

  path: ^1.9.0
  path_provider: ^2.1.5

  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.3
  connectivity_plus: ^6.1.0
  dio: ^5.7.0
  url_launcher: ^6.2.0

  # M3 (voice), M4 (GPS/photos), M6 (billing) — added now so later
  # milestones don't re-touch the manifest.
  speech_to_text: ^7.0.0
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  purchases_flutter: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.13

  riverpod_generator: ^2.6.4
  drift_dev: ^2.20.0

  freezed: ^2.5.8
  json_serializable: ^6.9.4

  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
